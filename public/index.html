<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mould Estimator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one job folder passed between two desks. App bar with a Sales | Purchase desk switch; the job opens on a 3-step rail
   (Enquiry & 3D -> Costing -> Quotation), each step owned by one desk and read-only for the other. Tool-room steel + brand orange. */
:root{
  --bg:#edf0f2; --surface:#ffffff; --surface-2:#f4f6f8; --ink:#22272d; --muted:#5d6670; --line:#d5dade; --line-2:#e6e9ec;
  --accent:#d9702a; --accent-strong:#b65819; --accent-ink:#ffffff; --accent-soft:#fbe9db;
  --steel:#34404c; --steel-ink:#ffffff;
  --sales:#2f6fb5; --sales-soft:#e2edf9; --purch:#7a4fb0; --purch-soft:#efe7f8;
  --ok:#1f7a4d; --ok-soft:#e0f2e8; --warn:#9a5a06; --warn-soft:#fcefd9; --bad:#b42318; --bad-soft:#fde5e2; --info:#3d5a73; --info-soft:#e4ebf1;
  --c-pl:#3b7fc4; --c-rd:#8a5cc7; --c-bo:#2f9a68; --band:#ddd5b0; --band-ink:#2e2a17; --band-line:#c5bb8e;
  --f-display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]):not([data-theme="semi"]){
  --bg:#13171b; --surface:#1b2026; --surface-2:#222930; --ink:#e6e9ec; --muted:#9aa3ad; --line:#323a43; --line-2:#28303a;
  --accent:#f0924f; --accent-strong:#f6a86d; --accent-ink:#1b1206; --accent-soft:#3a2617;
  --steel:#c7cfd8; --steel-ink:#141a20;
  --sales:#7fb2ec; --sales-soft:#1c2b3d; --purch:#bf9bf0; --purch-soft:#2a2139;
  --ok:#6fd0a0; --ok-soft:#163326; --warn:#f0b056; --warn-soft:#3a2a12; --bad:#f2867a; --bad-soft:#3d1c19; --info:#a9c0d4; --info-soft:#1e2a35;
  --c-pl:#6aa6e6; --c-rd:#b28ce8; --c-bo:#5cc795; --band:#3b3622; --band-ink:#ebe3c0; --band-line:#544d31; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13171b; --surface:#1b2026; --surface-2:#222930; --ink:#e6e9ec; --muted:#9aa3ad; --line:#323a43; --line-2:#28303a;
  --accent:#f0924f; --accent-strong:#f6a86d; --accent-ink:#1b1206; --accent-soft:#3a2617;
  --steel:#c7cfd8; --steel-ink:#141a20;
  --sales:#7fb2ec; --sales-soft:#1c2b3d; --purch:#bf9bf0; --purch-soft:#2a2139;
  --ok:#6fd0a0; --ok-soft:#163326; --warn:#f0b056; --warn-soft:#3a2a12; --bad:#f2867a; --bad-soft:#3d1c19; --info:#a9c0d4; --info-soft:#1e2a35;
  --c-pl:#6aa6e6; --c-rd:#b28ce8; --c-bo:#5cc795; --band:#3b3622; --band-ink:#ebe3c0; --band-line:#544d31; color-scheme:dark}
/* semi-light: softer greys, lower glare, same ink */
:root[data-theme="semi"]{
  --bg:#d3d8dd; --surface:#e7eaed; --surface-2:#dce0e4; --ink:#22272d; --muted:#535c66; --line:#bcc3ca; --line-2:#cdd2d7;
  --accent:#c8641f; --accent-strong:#a8521a; --accent-soft:#ecd9c8;
  --sales-soft:#d3dfec; --purch-soft:#e0d8ea; --ok-soft:#d1e5d9; --warn-soft:#eedfc6; --bad-soft:#efd6d2; --info-soft:#d6dde4;
  --band:#cfc6a0; --band-line:#b5ab7f; color-scheme:light}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font:15px/1.45 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:.01em;text-wrap:balance}
h2{font-size:21px;font-weight:700}
h3{font-size:16.5px;font-weight:700}
.eyebrow{font:600 11.5px/1.2 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:1380px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-top:14px}

/* app bar */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:var(--surface);border-bottom:1px solid var(--line);margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.barin{max-width:1380px;margin:0 auto;display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.logo{background:#fff;border-radius:4px;padding:3px 7px 3px 4px;line-height:0;box-shadow:0 0 0 1px var(--line);flex:none}
.logo img{width:132px;height:auto;display:block}
.brand b{display:block;font:700 21px/1 var(--f-display);letter-spacing:.02em}
.brand small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.desk{display:flex;align-items:center;gap:8px;margin-left:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface-2)}
.seg button{border:0;background:none;border-radius:999px;padding:6px 16px;font:600 15px/1 var(--f-display);letter-spacing:.03em;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:6px}
.seg button i{width:8px;height:8px;border-radius:50%;display:block;background:currentColor;opacity:.6}
.seg button[aria-pressed="true"][data-role="sales"]{background:var(--sales);color:#fff}
.seg button[aria-pressed="true"][data-role="purchase"]{background:var(--purch);color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#10151a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#10151a}}
.who{font-size:12.5px;color:var(--muted);white-space:nowrap}
.theme{font-size:12.5px;padding:5px 8px;border:1px solid var(--line);border-radius:999px;background:var(--surface-2);color:var(--ink);cursor:pointer}
.conn{display:inline-flex;align-items:center;gap:5px}
.conn i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:block}
.conn.live i{background:var(--ok)}
@media (max-width:640px){.logo img{width:104px}.brand small{display:none}.desk{margin-left:0;width:100%;justify-content:space-between}}

/* buttons */
.btn{font:600 14.5px/1 var(--f-display);letter-spacing:.03em;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent-strong)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong);color:var(--accent-ink)}
.btn.dark{background:var(--steel);border-color:var(--steel);color:var(--steel-ink)}
.btn.dark:hover{filter:brightness(1.12);color:var(--steel-ink)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13.5px}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:disabled:hover{border-color:var(--line);color:inherit}
.btn.primary:disabled:hover{color:var(--accent-ink);background:var(--accent)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sp{flex:1}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0}
.ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
.pb{padding:14px}
.flow{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.flow b{font-weight:600;color:var(--ink)}
.flow .arr{color:var(--line)}
.tag{display:inline-flex;align-items:center;gap:4px;font:600 11px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;padding:4px 7px;border-radius:4px;white-space:nowrap}
.tag.sales{background:var(--sales-soft);color:var(--sales)}
.tag.purchase{background:var(--purch-soft);color:var(--purch)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;font:600 12px/1 var(--f-display);letter-spacing:.05em;padding:5px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-draft{background:var(--info-soft);color:var(--info)}
.st-costing{background:var(--warn-soft);color:var(--warn)}
.st-costed{background:var(--purch-soft);color:var(--purch)}
.st-quoted{background:var(--accent-soft);color:var(--accent-strong)}
.st-won{background:var(--ok-soft);color:var(--ok)}
.st-lost{background:var(--bad-soft);color:var(--bad)}
.ex{font:600 10.5px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;border:1px dashed var(--muted);color:var(--muted);padding:3px 5px;border-radius:3px;margin-left:6px}

/* list */
.listhead{display:flex;align-items:flex-end;gap:10px 16px;flex-wrap:wrap}
.listhead p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:8px}
.kpis>button{all:unset;cursor:pointer;padding:12px 14px;border-left:1px solid var(--line-2);display:flex;flex-direction:column;gap:2px;min-width:0}
.kpis>button:first-child{border-left:0}
.kpis>button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.kpis>button[aria-pressed="true"]{background:var(--surface-2);box-shadow:inset 0 -3px 0 var(--accent)}
.kpis b{font:700 28px/1.05 var(--f-display);font-variant-numeric:tabular-nums}
.kpis small{color:var(--muted);font-size:12.5px}
@media (max-width:700px){.kpis{grid-template-columns:1fr 1fr}.kpis>button:nth-child(3){border-left:0}.kpis>button:nth-child(-n+2){border-bottom:1px solid var(--line-2)}}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line)}
.search{flex:1 1 220px;max-width:360px}
.search input{width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2)}
.search input:focus{outline:none;border-color:var(--accent);background:var(--surface)}

/* tables */
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font:600 11.5px/1.2 var(--f-display);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 8px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:4px 8px;border-bottom:1px solid var(--line-2);vertical-align:middle;white-space:nowrap}
th.r,td.r{text-align:right}
td.c{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px;text-align:right;color:var(--muted)}
td.c.s{color:var(--ink);font-weight:500}
td.sn{font-family:var(--f-mono);font-size:12px;color:var(--muted);width:30px}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
tr.tot td{font-weight:600;background:var(--surface-2);border-top:1px solid var(--line)}
tr.tot td.c{color:var(--ink)}
td input,td select{width:100%;min-width:0;background:transparent;border:1px solid transparent;border-radius:4px;padding:5px 6px;font-size:14px}
td input:hover:not(:disabled),td select:hover:not(:disabled){border-color:var(--line)}
td input:focus,td select:focus{outline:none;border-color:var(--accent);background:var(--surface)}
td input.n{font-family:var(--f-mono);font-size:13.5px;text-align:right}
td input:disabled,td select:disabled{opacity:1;color:var(--ink);-webkit-text-fill-color:var(--ink);appearance:none;-webkit-appearance:none}
td input.est{background:var(--warn-soft)}
.w-name{min-width:170px}.w-mat{min-width:150px}.w-d{width:72px}.w-q{width:56px}.w-ht{min-width:140px}
.dims{display:flex;align-items:center;gap:2px;color:var(--muted)}
.dims input{width:66px}
.cat{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:middle}
.cat.pl{background:var(--c-pl)}.cat.rd{background:var(--c-rd)}.cat.bo{background:var(--c-bo)}
.del{border:0;background:none;color:var(--muted);width:28px;height:28px;border-radius:4px;cursor:pointer;font-size:17px;line-height:1}
.del:hover{color:var(--bad);background:var(--bad-soft)}
.empty{padding:34px 16px;text-align:center;color:var(--muted);white-space:normal}
.empty b{display:block;color:var(--ink);font:700 18px var(--f-display);margin-bottom:4px}

/* job */
.jobhead{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.jobno{font:700 26px/1 var(--f-display);letter-spacing:.02em}
.jobmeta{color:var(--muted);font-size:13.5px;min-width:0}
.back{border:0;background:none;color:var(--muted);cursor:pointer;font:600 14px var(--f-display);letter-spacing:.03em;padding:4px 0}
.back:hover{color:var(--accent-strong)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.step{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;padding:10px 14px;border-left:1px solid var(--line-2);min-width:0}
.step:first-child{border-left:0}
.step:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.step>b{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);font:700 15px var(--f-display);flex:none;color:var(--muted)}
.step span{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0}
.step strong{font:700 16px/1.1 var(--f-display);letter-spacing:.02em}
.step em{font-style:normal;font-size:12.5px;color:var(--muted)}
.step[aria-current="step"]{background:var(--accent-soft);box-shadow:inset 0 -3px 0 var(--accent)}
.step[aria-current="step"]>b{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step.done>b{border-color:var(--ok);color:var(--ok)}
@media (max-width:760px){.steps{grid-template-columns:1fr}.step{border-left:0;border-top:1px solid var(--line-2)}.step:first-child{border-top:0}}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.banner.lock{background:var(--surface-2);color:var(--muted)}
.banner.go{border-color:var(--accent);background:var(--accent-soft)}
.banner b{color:var(--ink)}

.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 14px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font:600 11.5px/1.2 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.field input:disabled,.field select:disabled,.field textarea:disabled{background:transparent;border-color:var(--line-2);color:var(--ink);opacity:1;-webkit-text-fill-color:var(--ink)}
.field textarea{resize:vertical;min-height:70px}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.g-cad{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;align-items:start}
.g-q{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:980px){.g2,.g-cad,.g-q{grid-template-columns:minmax(0,1fr)}}

/* 3D */
.drop{position:relative;border:1.5px dashed var(--line);border-radius:8px;padding:20px 16px;text-align:center;background:var(--surface-2);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.drop b{font:700 18px var(--f-display)}
.fmts{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.fmts span{font:500 11.5px var(--f-mono);border:1px solid var(--line);padding:2px 6px;border-radius:3px;color:var(--muted);background:var(--surface)}
.viewer{position:relative;height:340px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:linear-gradient(var(--surface-2),var(--surface))}
.viewer canvas{display:block;width:100%!important;height:100%!important}
.viewer .vmsg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;color:var(--muted);font-size:14px}
.viewer .legend{position:absolute;left:10px;bottom:8px;display:flex;gap:10px;font-size:12px;color:var(--muted);background:var(--surface);padding:4px 8px;border-radius:4px;border:1px solid var(--line-2)}
.progress{height:6px;border-radius:3px;background:var(--line-2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}
.kv span:nth-child(odd){color:var(--muted)}
.kv span:nth-child(even){font-family:var(--f-mono);text-align:right}
.budget{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 14px;border-radius:8px;background:var(--sales-soft)}
.budget b{font:700 26px/1 var(--f-display);color:var(--sales);font-variant-numeric:tabular-nums}
.subtabs{display:flex;gap:6px;flex-wrap:wrap}
.subtab{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:6px;padding:7px 12px;cursor:pointer;font:600 14px/1 var(--f-display);letter-spacing:.02em;display:flex;gap:7px;align-items:baseline}
.subtab small{font:400 12px var(--f-mono)}
.subtab[aria-current="true"]{background:var(--steel);border-color:var(--steel);color:var(--steel-ink)}

/* quote */
.classes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.mclass{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);min-width:0}
.mclass:focus-visible{outline:2px solid var(--accent)}
.mclass>b{display:grid;place-items:center;width:32px;height:32px;border-radius:5px;border:1.5px solid var(--line);font:700 19px var(--f-display);flex:none}
.mclass span{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.mclass strong{font:600 13.5px var(--f-display)}
.mclass em{font-style:normal;font-size:12px;color:var(--muted)}
.mclass.on{border-color:var(--accent);background:var(--accent-soft)}
.mclass.on>b{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mclass[aria-disabled="true"]{cursor:default}
@media (max-width:900px){.classes{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sum td{padding:7px 10px}
.sum tr.sub td{font-weight:600;background:var(--surface-2)}
.sum tr.final td{background:var(--accent-soft);color:var(--accent-strong);font-weight:700;font-size:15.5px;border-top:1.5px solid var(--accent)}
.sum td.l{white-space:normal}
.bar{display:flex;height:14px;border-radius:3px;overflow:hidden;background:var(--surface-2)}
.bar i{display:block;height:100%}
.legend2{display:grid;grid-template-columns:12px 1fr auto auto;gap:6px 10px;font-size:13.5px;align-items:center}
.legend2 s{width:12px;height:12px;border-radius:2px;display:block}
.legend2 .pc{font:12px var(--f-mono);color:var(--muted);text-align:right;min-width:44px}


/* cost break-up sheet */
.buh{width:auto;min-width:640px}
.buh th{background:var(--band);color:var(--band-ink);text-transform:none;letter-spacing:.02em;font-size:13px;border:1px solid var(--band-line)}
.buh td{border:1px solid var(--line-2)}
.g-bu{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(520px,1fr);gap:12px;align-items:start}
.but td.w-u{width:44px;min-width:44px}.g-bu>div:last-child .but td.w-d{width:80px;min-width:80px}.g-bu>div:last-child .but td.w-q{width:66px;min-width:66px}.but td.w-u input{min-width:40px}.but .tv{display:block;text-align:right;font-family:var(--f-mono);padding:4px 2px}.but small.bnote{display:block;color:var(--muted);font-size:11.5px}
@media (max-width:1720px){.g-bu{grid-template-columns:minmax(0,1fr)}.g-bu>div:last-child{max-width:720px}}
.but{font-size:13.5px}
.but td,.but th{border:1px solid var(--line-2);padding:2px 5px}
.but td.w-d{width:64px;min-width:64px}.but td.w-q{width:50px;min-width:50px}.but td.w-name{min-width:150px}.but td.w-mat{min-width:150px}.but td.w-m{min-width:96px}
.g-bu>div:first-child .but{min-width:960px}
.but tr.band td,.but tr.band th{background:var(--band);color:var(--band-ink);font:600 12.5px/1.2 var(--f-display);letter-spacing:.06em;text-transform:uppercase;border-color:var(--band-line);padding:6px 6px}
.but tr.band td.c{font:600 13px var(--f-mono);color:var(--band-ink);letter-spacing:0;text-transform:none}
.but tr.strong td{font-size:13.5px}
.but td.ctr{text-align:center}
.but tr.finalrow td{color:var(--bad);font-weight:700;font-size:15px;background:var(--bad-soft)}
.but tr.finalrow td.c{color:var(--bad)}
.w-m{width:104px}
td input.ovr{background:var(--sales-soft);color:var(--sales);-webkit-text-fill-color:var(--sales);font-weight:600}
.swatch{display:inline-block;width:12px;height:12px;border-radius:2px;background:var(--sales-soft);border:1px solid var(--sales);vertical-align:-1px;margin-right:5px}
.po{display:inline-flex;align-items:center;gap:6px}.po input{width:64px}
.bufoot{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,1fr);border:1px solid var(--line);border-radius:4px;font-size:13.5px}
.bufoot>div{padding:10px 12px;border-left:1px solid var(--line-2);min-width:0}.bufoot>div:first-child{border-left:0}
@media (max-width:700px){.bufoot{grid-template-columns:1fr}.bufoot>div{border-left:0;border-top:1px solid var(--line-2)}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-size:14px;z-index:50;max-width:calc(100% - 32px)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;border:1px solid var(--warn);background:var(--warn-soft);border-radius:6px;font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.banner.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--ink)}
.banner.bad b{color:var(--bad)}
.banner.warn{border-color:var(--warn);background:var(--warn-soft)}
.nf{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--bad);color:var(--surface);font:700 12px/1 var(--f-display);margin-left:4px;vertical-align:middle;cursor:help}
.nf.w{background:var(--warn)}
.nfp{display:inline-block;font:600 10.5px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--bad);background:var(--bad-soft);padding:3px 6px;border-radius:3px;margin-left:6px;white-space:nowrap}
.nfp.w{color:var(--warn);background:var(--warn-soft)}
.fz td{vertical-align:top}
.fz .res{font:600 12px/1.2 var(--f-display);white-space:nowrap}
.fz .res.bad{color:var(--bad)}.fz .res.warn{color:var(--warn)}
.fzok{display:flex;gap:10px;align-items:center;color:var(--ok);font-weight:600}
.fzrule{font-size:13px;color:var(--muted);padding:10px 16px;border-top:1px solid var(--line)}
i.cat.nfc{background:var(--bad)}
td.xsel{background:var(--sales-soft)!important;box-shadow:inset 0 0 0 1px var(--sales)}td.xsel input,td.xsel select{background:transparent}
.xlhint{border-bottom:1px dotted var(--muted);cursor:help}
.nmw{display:flex;align-items:center;gap:8px}.nmw input{flex:1;min-width:0}
.thumb{flex:none;width:64px;height:48px;border:1px solid var(--line);border-radius:4px;background:#fff;display:grid;place-items:center;overflow:hidden;cursor:zoom-in}
.thumb img{width:64px;height:48px;display:block}.thumb.none{cursor:default;color:#8a939c;font:600 10px var(--f-display);letter-spacing:.06em;text-transform:uppercase;background:var(--surface-2)}
.thumb.wait{background:linear-gradient(90deg,var(--surface-2),#fff,var(--surface-2));background-size:200% 100%;animation:shim 1.2s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
#isoPop{position:fixed;z-index:60;width:320px;height:240px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 32px rgba(0,0,0,.28);pointer-events:none;overflow:hidden}
#isoPop[hidden]{display:none}#isoPop img{width:320px;height:240px;display:block}#isoPop b{position:absolute;left:10px;bottom:8px;font:600 12.5px var(--f-display);color:#2a3036;background:rgba(255,255,255,.85);padding:2px 6px;border-radius:3px}
@media (prefers-reduced-motion:reduce){.thumb.wait{animation:none}}
ul.learn{list-style:none;margin:0;padding:0;display:grid;gap:8px}ul.learn label{display:flex;gap:10px;align-items:baseline;font-size:14px;cursor:pointer}ul.learn span{color:var(--muted)}
.rights th.c{font-size:12px;white-space:normal;min-width:84px;text-align:center}.rights td.c{text-align:center}.rights input[type=checkbox]{width:18px;height:18px}.rights td input[type=checkbox]:disabled{appearance:auto;-webkit-appearance:checkbox;opacity:.55}
.uhits{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:8px}.catcard{display:flex;flex-direction:column;gap:6px;text-align:left;padding:18px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);cursor:pointer;font:inherit}.catcard:hover,.catcard:focus-visible{border-color:var(--accent);outline:none}.catcard b{font-size:17px}.catcard span{color:var(--muted);font-size:13.5px}
</style>
<script>window.mouldUI={async add(){const g=id=>document.getElementById(id).value.trim();try{const r=await mouldAuth.addLogin(g('nl_email'),g('nl_name'),g('nl_pw'));const A=window.__app;A.toast('Login ready for '+r.user.email);A.S.people.add(r.user.id);A.S.names=A.S.names||{};A.S.names[r.user.id]=r.user.name;A.render()}catch(e){window.__app.toast(e.message)}},
 async importFile(inp){const f=inp.files[0];if(!f)return;try{const j=JSON.parse(await f.text());const r=await mouldAuth.importBackup(j.docs||[]);window.__app.toast('Imported '+r.imported+' records. Loading…');setTimeout(()=>location.reload(),1200)}catch(e){window.__app.toast('Import failed: '+e.message)}}};</script>

      const grp=new THREE.Group();const col={pl:cssVar('--c-pl'),rd:cssVar('--c-rd'),bo:cssVar('--c-bo'),nf:cssVar('--bad')};
      let mn=[1e18,1e18,1e18],mx=[-1e18,-1e18,-1e18];
      for(const b of cad.bodies){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(b.pos,3));if(b.idx)g.setIndex(new THREE.BufferAttribute(b.idx,1));g.computeVertexNormals();
        const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:new THREE.Color((fm[b.pid]&&fm[b.pid].sev==='bad')?col.nf:(col[b.cat]||'#999')),metalness:0.25,roughness:0.55}));grp.add(m);
        for(let a=0;a<3;a++){mn[a]=Math.min(mn[a],b.min[a]);mx[a]=Math.max(mx[a],b.max[a])}}
      const ctr=[0,1,2].map(a=>(mn[a]+mx[a])/2),R=Math.hypot(mx[0]-mn[0],mx[1]-mn[1],mx[2]-mn[2])/2||100;
      grp.position.set(-ctr[0],-ctr[1],-ctr[2]);sc.add(grp);
      const cam=new THREE.PerspectiveCamera(35,1,R/100,R*20);cam.position.set(R*1.9,R*1.5,R*2.2);cam.lookAt(0,0,0);
      const ctl=window.THREE.OrbitControls?new THREE.OrbitControls(cam,r.domElement):null;if(ctl){ctl.enableDamping=true}
      Object.assign(V,{renderer:r,scene:sc,cam,ctl,jobId:job.id,sig});
      cancelAnimationFrame(V.raf);const loop=()=>{V.raf=requestAnimationFrame(loop);if(!V.renderer.domElement.isConnected)return;if(V.ctl)V.ctl.update();V.renderer.render(V.scene,V.cam)};loop();
    }catch(e){V.renderer=null;box.querySelector('.vmsg').textContent='3D view is not available in this browser. The part list below still works.';return}
  }
  const msg=box.querySelector('.vmsg');if(msg)msg.remove();
  box.prepend(V.renderer.domElement);const w=box.clientWidth,h=box.clientHeight;V.renderer.setSize(w,h,false);V.cam.aspect=w/h;V.cam.updateProjectionMatrix();
}

/* ---------- permissions by desk ---------- */
function canEdit(step,job){
  if(!job)return false;const st=job.status;
  return ST(job)==='draft'&&can('edit');
}

/* ---------- render ---------- */
function render(){
  const a=document.activeElement,fid=a&&a.id,ss=a&&a.selectionStart,se=a&&a.selectionEnd;
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.role===S.role));
  let html='';
  try{
  if(S.view==='job'&&curJob())html=renderJob(curJob());
  else if(S.view==='rates')html=renderRates();
  else if(S.view==='newcat')html=`<div><button class="back" type="button" data-act="home">← Enquiries</button></div><section class="listhead"><div><span class="eyebrow">New enquiry</span><h2>What are we estimating?</h2><p>The category sets the starting hours for design, EDM and polishing, whether assembly is added, and whether the quote is one set price or a price per part. You can change it later in step 1.</p></div></section><div class="catgrid">${CATS.map(([k,l,d])=>`<button type="button" class="catcard" data-newcat="${k}"><b>${l}</b><span>${d}</span></button>`).join('')}</div>`;
  else{S.view='list';html=renderList()}
  }catch(err){console.error(err);const msg=String(err&&err.message||err),at=String(err&&err.stack||'').split('\n').slice(1,3).join(' ').trim();
    html=`<div class="banner bad" role="alert"><b>Something went wrong showing this page.</b> Please send this message to the app builder: ${esc(msg)} ${esc(at)}</div><div><button class="back" type="button" data-act="home">← Enquiries</button></div>`}
  $('#app').innerHTML=html;paintSel();queueThumbs();
  if(S.view==='job'&&curJob())mountViewer(curJob());
  if(fid){const el=document.getElementById(fid);if(el){el.focus({preventScroll:true});try{if(ss!=null&&el.setSelectionRange)el.setSelectionRange(ss,se)}catch(e){}}}
}
function pill(s){const x=STATUS[s]||STATUS.draft;return `<span class="pill ${x[1]}">${x[0]}</span>`}

function renderList(){
  const sales=S.role==='sales',jobs=[...S.jobs.values()].sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));

  let f=S.filter&&groups.find(g=>g[0]===S.filter)?S.filter:'all';
  const fn=groups.find(g=>g[0]===f)[2],q=S.q.trim().toLowerCase();
  const rows=jobs.filter(fn).filter(j=>!q||[j.no,j.customer,j.part,j.mouldNo].join(' ').toLowerCase().includes(q));
  const k=groups.map(g=>`<button type="button" data-filter="${g[0]}" aria-pressed="${g[0]===f}"><b>${jobs.filter(g[2]).length}</b><small>${g[1]}</small></button>`).join('');
  const head=`<div><span class="eyebrow">Sales</span><h2>Enquiries &amp; quotations</h2><p>Create the enquiry and load the customer's 3D model or BOM. Check the cost break-up, set the margin and send the quotation.</p></div>`;

      <td>${pill(ST(j))}</td><td class="c">${qv}</td><td class="muted">${fmtDate(j.updatedAt)}</td></tr>`}).join('')
    :`<tr><td colspan="8" class="empty"><b>${jobs.length?'No jobs match':'No jobs yet'}</b>${jobs.length?'Try another filter or search.':'Start with “New enquiry”: load a STEP model or BOM, or build a standard mould base by size.'}</td></tr>`;
  return `<section class="listhead">${head}<span class="sp"></span><div class="actions">${btns}</div></section>
  <div class="flow"><b>Enquiry &amp; 3D model</b><span class="arr">→</span><b>Cost break-up</b><span class="arr">→</span><b>Margin &amp; quotation</b><span class="arr">→</span><b>Won / Lost</b></div>

  <div class="scroll"><table><thead><tr><th>Estimate no.</th><th>Customer</th><th>Part</th><th>Mould size (mm)</th><th class="r">Lines</th><th>Status</th><th class="r">Quote ex-GST</th><th>Updated</th></tr></thead><tbody>${body}</tbody></table></div></section>`;

function renderJob(job){
  const sj=ST(job),closed=['quoted','won','lost'].includes(sj),done={1:(job.parts||[]).length>0,2:closed,3:closed};
  const stepDef=[[1,'Enquiry & 3D model','Customer, model or BOM, part list'],[2,'Cost break-up','Parts, process, qty × rate'],[3,'Margin & quotation','Class, discount, quotation PDF']];
  const steps=stepDef.map(([n,t,o])=>`<button type="button" class="step ${done[n]?'done':''}" data-step="${n}" aria-current="${S.step===n?'step':'false'}"><b>${done[n]?'✓':n}</b><span><strong>${t}</strong><em>${o}</em></span></button>`).join('');
  let acts='';const sales=S.role==='sales';
  if(sj==='draft'&&can('quote'))acts+=`<button class="btn primary" type="button" data-act="quoted" ${(job.parts||[]).length?'':'disabled'} title="Freezes today's rates for this quote">Mark quoted</button>`;
  if(sales&&can('quote')&&job.status==='quoted')acts+=`<button class="btn ghost" type="button" data-act="unquote">Revise quote</button><button class="btn" type="button" data-act="lost">Lost</button><button class="btn primary" type="button" data-act="won">Won</button>`;
  if(sales&&can('quote')&&['won','lost'].includes(job.status))acts+=`<button class="btn ghost" type="button" data-act="unquote">Reopen to edit</button>`;
  const conf=S.confirm==='del'?`<div class="confirm">Delete ${esc(job.no)} for everyone? This cannot be undone. <button class="btn sm danger" type="button" data-act="delYes">Delete</button><button class="btn sm ghost" type="button" data-act="delNo">Keep</button></div>`:'';
  let body=S.step===1?renderStep1(job):S.step===2?renderStep2(job):renderStep3(job);
  return `<div><button class="back" type="button" data-act="home">← Enquiries</button></div>
  <section class="jobhead"><div><span class="eyebrow">Estimate</span><div class="jobno">${esc(job.no)}${job.example?'<span class="ex">Example</span>':''}</div></div>
    <div class="jobmeta">${esc(job.customer)||'No customer yet'} · ${esc(job.part)||'part not named'}<br>${esc(catName(job))} ${mouldSize(job)} mm · ${(job.parts||[]).length} part lines</div>
    ${pill(sj)}<span class="sp"></span><div class="actions">${acts}${sj==='draft'&&can('del')?`<button class="btn ghost danger sm" type="button" data-act="del">Delete</button>`:''}</div></section>
  ${conf}
  ${closed?`<div class="banner lock"><b>${STATUS[sj][0]}.</b> Rates are frozen as quoted. Use “${sj==='quoted'?'Revise quote':'Reopen to edit'}” to change it.</div>`:''}
  ${feasBanner(job)}
  <nav class="steps" aria-label="Job steps">${steps}</nav>${body}`;
}
function feasBanner(job){const l=feasChecks(job);if(!l.length)return '';const b=l.filter(x=>x.sev==='bad'),np=new Set(b.map(x=>x.pid)).size,ts=[...new Set((b.length?b:l).map(x=>x.t))];
  return `<div class="banner ${b.length?'bad':'warn'}" role="alert"><b>${b.length?`Not feasible on 3-axis VMC: ${np} part${np>1?'s':''}.`:'Needs angle fixture.'}</b> ${esc(ts.join(' · '))}. ${S.step!==1?'<button class="btn sm" type="button" data-step="1">See details</button>':'<a href="#feas">See details below</a>'}</div>`}
function dis(ed){return ed?'':'disabled'}

function partsTable(job,step){

    for(const p of list){i++;const c=calcPart(p,M),id=p.id;
      const size=p.cat==='pl'?`<span class="dims">${nIn('L'+id,`job:parts.#${id}.L`,p.L,ed)}×${nIn('W'+id,`job:parts.#${id}.W`,p.W,ed)}×${nIn('T'+id,`job:parts.#${id}.T`,p.T,ed)}</span>`

    rows+=`<tr class="tot"><td></td><td colspan="5">Total raw steel</td><td class="c">${kg(t.wt)}</td><td></td></tr>`;
  }else if(sub==='pl'){
    h=`<tr><th></th><th>Plate</th><th class="r">Qty</th><th>Material</th><th>Finish L × W × T</th><th>Raw size</th><th class="r">Kg/pc</th><th class="r">Material ₹</th><th class="r">Holes</th><th class="r">Gun drill mm<br><small>straight</small></th><th class="r">Gun drill mm<br><small>angular</small></th><th>Treatment</th><th class="r">VMC / other ₹</th><th class="r">Cost/pc</th><th class="r">Total</th><th></th></tr>`;
    for(const p of list){i++;const c=calcPart(p,M),id=p.id;sum+=c.tot;
      rows+=`<tr><td class="sn">${i}${feasMark(fm,p)}</td><td class="w-name"><span class="nmw">${thumbImg(job,p)}${inp('nm'+id,`job:parts.#${id}.name`,p.name,ed)}</span></td><td class="w-q">${nIn('q'+id,`job:parts.#${id}.qty`,p.qty,ed)}</td><td class="w-mat">${matSel('mt'+id,p,ed)}</td>
      <td><span class="dims">${nIn('L'+id,`job:parts.#${id}.L`,p.L,ed)}×${nIn('W'+id,`job:parts.#${id}.W`,p.W,ed)}×${nIn('T'+id,`job:parts.#${id}.T`,p.T,ed)}</span></td><td class="c">${c.raw}</td><td class="c">${kg(c.wt)}</td><td class="c">${inr(c.mat)}</td>
      <td class="w-q">${nIn('ho'+id,`job:parts.#${id}.holes`,p.holes,ed,p.holesEst?'est':'')}</td><td class="w-d">${nIn('gd'+id,`job:parts.#${id}.gun`,p.gun,ed,p.gunEst?'est':'')}</td><td class="w-d">${nIn('ga'+id,`job:parts.#${id}.gunA`,p.gunA||0,ed,p.gunEst?'est':'')}</td><td class="w-ht">${htSel('ht'+id,p,ed)}</td><td class="w-d">${nIn('ot'+id,`job:parts.#${id}.other`,p.other,ed)}</td>
      <td class="c">${inr(c.pc)}</td><td class="c s">${inr(c.tot)}</td><td>${ed?`<button class="del" type="button" data-delpart="${id}" aria-label="Remove">×</button>`:''}</td></tr>`}

    for(const p of list){i++;const c=calcPart(p,M),id=p.id;sum+=c.tot;
      rows+=`<tr><td class="sn">${i}${feasMark(fm,p)}</td><td class="w-name"><span class="nmw">${thumbImg(job,p)}${inp('nm'+id,`job:parts.#${id}.name`,p.name,ed)}</span></td><td class="w-name">${inp('sp'+id,`job:parts.#${id}.spec`,p.spec,ed)}</td><td class="w-mat">${inp('mk'+id,`job:parts.#${id}.make`,p.make,ed)}</td>

const closed=j=>['quoted','won','lost'].includes(ST(j));
function renderStep2(job){
  const ed=canEdit(2,job),t=jobCost(job),live=costJob(job,jobM(job)),sales=false,b=breakup(job);

    <span>C · design</span><span>${inr(b.C)}</span><span>D · process</span><span>${inr(b.D)}</span><span>E · others</span><span>${inr(b.E)}</span>
    <span style="color:var(--ink);font-weight:600">Total A+B+C+D+E</span><span style="font-weight:600">${inr(b.total)}</span></div>`;

    <section class="panel"><div class="ph"><h3>Note from Purchase</h3></div><div class="pb"><p style="margin:0;white-space:pre-wrap">${esc(job.purchaseNote)||'<span class="muted">No note.</span>'}</p></div></section>`;
  }
  if(!['bu','pl','rd','bo','raw'].includes(S.sub))S.sub='bu';
  const tabs=[['bu','Break-up sheet',b.total],['pl','Plates',live.pl],['rd','Round parts',live.rd],['bo','Bought-out',live.bo],['raw','Raw material list',null]].map(([k,l,v])=>`<button type="button" class="subtab" data-sub="${k}" aria-current="${S.sub===k}">${l}${v!=null?` <small>${inr(v)}</small>`:''}</button>`).join('');
  const E=job.extras||{};

  let main;
  if(S.sub==='bu')main=renderBreakup(job,{ed,edPo:false,profit:false});
  else if(S.sub==='raw'){
    const g=new Map();for(const p of job.parts||[]){if(p.cat==='bo')continue;const c=calcPart(p,S.master);const x=g.get(p.mat)||{pcs:0,kg:0,amt:0,fin:0,scrap:0,lines:[]};x.pcs+=num(p.qty);x.kg+=c.wt*num(p.qty);x.fin+=c.fin*num(p.qty);x.scrap+=c.scrap*num(p.qty);x.amt+=c.mat*num(p.qty);x.lines.push(`${p.name} ${c.raw} × ${p.qty}`);g.set(p.mat,x)}
    const rows=[...g.entries()].map(([m,x])=>`<tr><td>${esc(m)}</td><td class="r mono">${x.pcs}</td><td class="c">${kg(x.kg)}</td><td class="c">${kg(x.fin)}</td><td class="c">${kg(x.scrap)}</td><td class="c">₹${matOf(S.master,m).rate}/kg</td><td class="c s">${inr(x.amt)}</td><td style="white-space:normal;font-size:13px" class="muted">${esc(x.lines.join(' · '))}</td></tr>`).join('');
    main=`<section class="panel"><div class="ph"><h3>Raw material to buy</h3><span class="muted" style="font-size:13px">Raw stock sizes include the stock allowance from the rate master.</span><span class="sp"></span><button class="btn sm" type="button" data-act="xlsPurchase">Export purchase list (Excel)</button></div>
      <div class="scroll"><table><thead><tr><th>Grade</th><th class="r">Pieces</th><th class="r">Raw kg</th><th class="r">Finished kg</th><th class="r">Scrap kg</th><th class="r">Rate</th><th class="r">Amount</th><th>Pieces (raw size × qty)</th></tr></thead><tbody>${rows||'<tr><td colspan="8" class="empty">No steel parts.</td></tr>'}${rows?(()=>{const t=costJob(job,S.master);return `<tr class="tot"><td>Total</td><td></td><td class="c">${kg(t.wt)}</td><td class="c">${kg(t.fin)}</td><td class="c">${kg(t.scrap)}</td><td colspan="3" class="muted" style="font-weight:400">Scrap about ${Math.round(t.wt?t.scrap/t.wt*100:0)}% of raw steel, worth ${inr(t.scrapVal)} at ₹${t.scrapRate}/kg. Not deducted from the quote.</td></tr>`})():''}</tbody></table></div></section>`;
  }else main=partsTable(job,2);
  return `<div class="actions"><nav class="subtabs" aria-label="Costing sheets">${tabs}</nav><span class="sp"></span><span class="muted" style="font-size:13px">${S.sub==='bu'?'Every figure fills in from the part sheets. Type over any of them.':'Shaded cells are estimates to check.'}</span></div>${main}
  <section class="g2"><div class="panel"><div class="ph"><h3>Delivery &amp; costing note</h3><span class="muted" style="font-size:13px">Feeds the break-up sheet</span></div><div class="pb"><div class="form">${ex('km','Delivery distance (km)')}</div>
    <div class="field" style="margin-top:12px"><label for="pnote">Internal costing note</label><textarea id="pnote" data-b="job:purchaseNote" ${dis(ed)} placeholder="e.g. P20 plates from stock; vendor rates checked on 10 Nov">${esc(job.purchaseNote)}</textarea></div></div></div>
    <div class="panel"><div class="ph"><h3>Cost summary</h3>${job.masterSnap&&closed(job)?'<span class="muted" style="font-size:13px">Rates frozen when quoted</span>':''}</div><div class="pb">${summ}</div></div></section>`;
}

function fmtV(c,dec){if(!c.auto){const r=((S.view==='job'&&curJob()&&(curJob().bu||{}).ov)||{})[c.k];return r==null?c.v:r}return dec?Math.round(c.v*10)/10:Math.round(c.v)}
function buIn(c,ed,dec){return `<input id="bu_${c.k.replace(/\W/g,'_')}" data-bu="${esc(c.k)}" inputmode="decimal" value="${esc(fmtV(c,dec))}" ${dis(ed)} class="n${c.auto?'':' ovr'}" title="${c.auto?'Filled automatically. Type to change it.':'Typed over. Clear it to go back to the automatic value.'}" aria-label="${esc(c.label||c.k)}">`}
function renderBreakup(job,o){
  const b=breakup(job),ed=o.ed,M=jobM(job),C=M.company||defaultMaster().company;

    <td class="w-d">${buIn(x.wt,ed,true)}</td><td class="w-d">${buIn(x.rate,ed)}</td><td class="w-m">${buIn(x.tot,ed)}</td><td>${ed?`<button class="del" type="button" data-delpart="${id}" aria-label="Remove ${esc(p.name)}">×</button>`:''}</td></tr>`}

  L+=`<tr class="band"><td colspan="13">Other</td></tr>`;
  const line=(x,cols,cls)=>x.extra
    ?`<tr><td colspan="${cols}">${inp('rl'+x.row.id,`job:bu.rows.${x.b}.#${x.row.id}.label`,x.row.label,ed,'','placeholder="Description"')}</td><td class="${cls}">${nIn('ra'+x.row.id,`job:bu.rows.${x.b}.#${x.row.id}.amt`,x.row.amt,ed)}</td><td>${ed?`<button class="del" type="button" data-delrow="${x.b}|${x.row.id}" aria-label="Remove line">×</button>`:''}</td></tr>`
    :`<tr><td colspan="${cols}">${esc(x.label)}</td><td class="${cls}">${buIn(x,ed)}</td><td></td></tr>`;
  for(const x of b.other)L+=line(x,11,'w-m');
  if(ed)L+=`<tr><td colspan="13"><button class="btn sm ghost" type="button" data-addrow="other">+ Other item</button></td></tr>`;
  L+=`<tr class="band"><td colspan="11" class="r">Total-B</td><td class="c">${inr(b.B)}</td><td></td></tr><tr class="band strong"><td colspan="6">Total input cost</td><td colspan="5" class="r">Total A + B</td><td class="c">${inr(b.AB)}</td><td></td></tr>`;

  const blk=(key,title,lab,val)=>{let h=`<tr class="band"><td colspan="6" class="ctr">${title}</td></tr>`;for(const x of b[key])h+=rline(x);

function renderStep3(job){

  const f=(k,l)=>`<div class="field"><label for="s_${k}">${l}</label>${inp('s_'+k,'job:sales.'+k,s[k],ed)}</div>`;

    ${(()=>{const ES=M.est=Object.assign({},defaultMaster().est,M.est||{});['cls','edm','polish','flow'].forEach(k=>ES[k]=Object.assign({},defaultMaster().est[k],ES[k]||{}));
